name: Feature request / 機能提案
description: 新機能・改善を提案する / Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題 / The problem
      description: どんな課題・不便を解決したいですか？ / What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案内容 / Proposed solution
      description: どう実現したいか / How you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / Alternatives considered
    validations:
      required: false
